name: tontine
description: TontineClair — Gestion de tontines communautaires pour la Côte d'Ivoire et l'Afrique de l'Ouest
publish_to: 'none'
version: 1.2.45+49

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # Navigation
  go_router: ^14.6.3

  # State management
  provider: 6.1.5+1

  # Local storage
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0

  # HTTP
  http: 1.5.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.1

  # Share / WhatsApp
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # Crypto (tirage certifié)
  crypto: ^3.0.3

  # Firebase Cloud Messaging (notifications push)
  firebase_core: 3.6.0
  firebase_messaging: 15.1.3
  firebase_auth: 5.3.1
  flutter_local_notifications: ^18.0.1

  # In-App Purchase (Google Play + Apple)
  # Activé pour la structure — les achats réels nécessitent publication store
  in_app_purchase: ^3.2.0

  # QR Code (paiement crypto in-app)
  qr_flutter: ^4.1.0

  # Accès système de fichiers (certificat blockchain, QR export)
  path_provider: ^2.1.5

  # Icons
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  # Les polices BricolageGrotesque et Inter sont chargées via google_fonts
