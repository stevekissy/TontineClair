name: tontine_admin
description: TontineClair Admin — Espace d'administration réservé
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # State management
  provider: 6.1.5+1

  # Local storage
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0

  # HTTP
  http: 1.5.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0

  # PDF (utilisé par supabase_service/pdf_service)
  pdf: ^3.11.1
  printing: ^5.13.1

  # Share / WhatsApp
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # Crypto (tirage certifié)
  crypto: ^3.0.3

  # In-App Purchase (requis par subscription_service)
  in_app_purchase: ^3.2.0

  # QR Code (paiement crypto in-app)
  qr_flutter: ^4.1.0

  # Fichiers temporaires (PDF/QR export)
  path_provider: ^2.1.4

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
