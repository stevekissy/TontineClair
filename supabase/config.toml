[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
jwt_expiry = 3600
enable_signup = true

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# sycapay-payment : verify_jwt=false obligatoire car SycaPay envoie ses
# webhooks sans Authorization header → sinon HTTP 401 et le callback est ignoré.
# Flutter passe toujours son anon key → l'action payer/confirmer/statut reste sécurisée.
[functions.sycapay-payment]
verify_jwt = false
