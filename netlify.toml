# ═══════════════════════════════════════════════════════════════════════════════
# TontineClair — netlify.toml
# Technologie : Flutter Web
#
# Le build est exécuté par netlify_build.sh qui :
#   1. installe Flutter 3.35.4
#   2. exécute flutter build web --release
#   3. génère le dossier build/web
#
# Variables d'environnement OBLIGATOIRES à configurer dans :
#   Netlify UI > Site settings > Environment variables
#     SUPABASE_URL      = https://mkmkpjdcydtpjwrmvbzd.supabase.co
#     SUPABASE_ANON_KEY = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
# ═══════════════════════════════════════════════════════════════════════════════

[build]
  command = "bash netlify_build.sh"
  publish = "build/web"

# Cache Flutter entre les builds pour accélérer les déploiements suivants
[build.environment]
  FLUTTER_VERSION = "3.35.4"

[build.cache]
  paths = [
    "$HOME/flutter",
    "$HOME/.pub-cache",
  ]

# Redirections SPA — OBLIGATOIRE pour Flutter Web
# Toutes les routes renvoient vers index.html (routage côté Flutter)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# En-têtes de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/**"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
