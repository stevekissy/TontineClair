# ═══════════════════════════════════════════════════════════════════════════════
# TontineClair — netlify.toml
#
# STRATÉGIE : déploiement par ZIP direct depuis le sandbox (pas de build Netlify)
# Le build Flutter se fait dans le sandbox, le résultat est uploadé via API.
#
# Ce fichier est présent uniquement pour les redirections SPA et headers.
# La commande de build est intentionnellement "exit 0" pour éviter toute erreur
# si Netlify tente quand même un build.
# ═══════════════════════════════════════════════════════════════════════════════

[build]
  command = "exit 0"
  publish = "build/web"

# Redirections SPA — OBLIGATOIRE pour Flutter Web
# Toutes les routes renvoient vers index.html (routage côté Flutter)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# En-têtes de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/**"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
